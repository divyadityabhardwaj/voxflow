name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: darwin/arm64
            os: macos-latest
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Building Tools
        run: brew install create-dmg portaudio pkg-config

      - name: Build Application
        run: |
          wails build -platform ${{ matrix.platform }} -clean \
            -ldflags "-X main.version=${GITHUB_REF_NAME#v}"

      - name: Create DMG
        working-directory: ./build/bin
        run: |
          create-dmg \
            --volname "Voxflow Installer" \
            --volicon "../../build/appicon.png" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "voxflow.app" 200 190 \
            --hide-extension "voxflow.app" \
            --app-drop-link 600 185 \
            "voxflow-${{ matrix.arch }}.dmg" \
            "voxflow.app"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/bin/voxflow-${{ matrix.arch }}.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
