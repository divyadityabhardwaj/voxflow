name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and release, e.g. v1.2.3"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build & Release
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a stable version tag such as v1.2.3"; exit 1; }'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # CI's cache holds cgo objects linked against Homebrew's portaudio; Go reuses
          # them regardless of PKG_CONFIG_PATH, so a release must build from scratch.
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"

      # No Homebrew portaudio on purpose: the app must link our static build.
      - name: Install build tools
        run: brew install create-dmg pkg-config

      - name: Cache native deps
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-deps.sh') }}

      - name: Build PortAudio and whisper.cpp
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: scripts/build-deps.sh "$RUNNER_TEMP/deps"

      - name: Stamp version
        run: |
          jq --arg v "${TAG#v}" '.info.productVersion = $v' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json

      - name: Build application
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/deps/lib/pkgconfig
        run: |
          wails build -platform darwin/arm64 -clean \
            -ldflags "-X main.version=${TAG#v}"

      # macOS keys Microphone/Accessibility grants to the signing identity. Ad-hoc
      # signatures change every build, so every update made users grant them again;
      # one fixed certificate keeps the identity stable across releases.
      - name: Import signing certificate
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "MACOS_SIGNING_P12 secret is missing"; exit 1; }
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASSWORD" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Bundle whisper, sign, check linkage
        env:
          SIGN_IDENTITY: VoxFlow Self-Signed
        run: |
          scripts/bundle.sh build/bin/voxflow.app "$RUNNER_TEMP/deps"
          codesign -d -r- build/bin/voxflow.app 2>&1 | grep "certificate leaf"

      - name: Smoke-test bundled whisper-cli
        run: build/bin/voxflow.app/Contents/MacOS/whisper-cli --help > /dev/null

      - name: Create in-app update archive
        working-directory: ./build/bin
        run: |
          ditto -c -k --keepParent --norsrc --noextattr voxflow.app voxflow-darwin-arm64.zip
          # Check the archive that clients will extract, including executable modes.
          mkdir "$RUNNER_TEMP/update-check"
          ditto -x -k voxflow-darwin-arm64.zip "$RUNNER_TEMP/update-check"
          codesign --verify --deep --strict "$RUNNER_TEMP/update-check/voxflow.app"
          test -x "$RUNNER_TEMP/update-check/voxflow.app/Contents/MacOS/voxflow-updater"

      - name: Create DMG
        working-directory: ./build/bin
        run: |
          create-dmg \
            --volname "VoxFlow Installer" \
            --volicon "../../build/appicon.png" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "voxflow.app" 200 190 \
            --hide-extension "voxflow.app" \
            --app-drop-link 600 185 \
            "voxflow-arm64.dmg" \
            "voxflow.app"
          shasum -a 256 voxflow-arm64.dmg voxflow-darwin-arm64.zip > SHA256SUMS

      - name: Summarize changes
        run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            echo "## What's new"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --format='- %s' -n 8 "$previous..$TAG"
              echo
              echo "Full changelog: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$TAG"
            else
              git log --no-merges --format='- %s' -n 5 "$TAG"
            fi
          } > "$RUNNER_TEMP/release-notes.txt"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body_path: ${{ runner.temp }}/release-notes.txt
          fail_on_unmatched_files: true
          files: |
            build/bin/voxflow-arm64.dmg
            build/bin/voxflow-darwin-arm64.zip
            build/bin/SHA256SUMS
